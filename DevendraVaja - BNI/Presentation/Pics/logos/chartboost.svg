<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <style>
      .cb-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-size: 52px; fill: #231F20; letter-spacing: -1.5px; }
      .cb-green { fill: #6B9E2B; }
    </style>
  </defs>
  <!-- Chartboost Green Dynamic Leaf / Folded Arrow Icon -->
