<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" width="280" height="120">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
  </defs>
  <rect width="280" height="120" rx="10" fill="#FEF2F2" stroke="#FEE2E2" stroke-width="1.5"/>
  
  <!-- English Only Screen -->
  <g transform="translate(18, 16)">
    <rect width="95" height="88" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="8" y="10" width="79" height="16" rx="4" fill="#0F2942"/>
    <text x="47" y="22" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">ENGLISH ONLY</text>
    <rect x="8" y="34" width="79" height="6" rx="2" fill="#E2E8F0"/>
    <rect x="8" y="44" width="55" height="6" rx="2" fill="#E2E8F0"/>
    <!-- Confused / Hesitant Badge -->
    <rect x="8" y="58" width="79" height="20" rx="4" fill="#FEE2E2"/>
    <text x="47" y="72" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#DC2626" text-anchor="middle">⚠️ Customer Friction</text>
  </g>

  <!-- The Wall / Drop-off Barrier -->
  <g transform="translate(125, 20)">
    <rect x="0" y="5" width="8" height="78" rx="4" fill="#EF4444"/>
    <path d="M -15 25 L 20 25" stroke="#DC2626" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M 10 50 L -10 65" stroke="#DC2626" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 65% Drop-off Stat Infographic -->
  <g transform="translate(150, 18)">
    <rect width="112" height="84" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
    <text x="56" y="36" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#DC2626" text-anchor="middle">65%</text>
    <text x="56" y="54" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#991B1B" text-anchor="middle">Drop-off Rate</text>
    <rect x="10" y="62" width="92" height="14" rx="7" fill="#FEE2E2"/>
    <text x="56" y="73" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#DC2626" text-anchor="middle">When Language Fails</text>
  </g>
</svg>