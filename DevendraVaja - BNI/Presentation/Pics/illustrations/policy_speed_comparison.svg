<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2"/>
      <stop offset="100%" stop-color="#FEE2E2"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F2942"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="340" rx="14" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <rect x="18" y="14" width="464" height="34" rx="8" fill="url(#primaryGrad)"/>
  <text x="32" y="35" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#38BDF8" letter-spacing="0.05em">OPERATIONAL TRANSFORMATION</text>
  <text x="470" y="35" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="end">10x Speed • Zero Clerical Typing</text>

  <!-- LEFT: 5-Day Clerical Bottleneck Card -->
  <g transform="translate(18, 58)">
    <rect width="216" height="216" rx="10" fill="url(#redGrad)" stroke="#FCA5A5" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="216" height="32" rx="10" fill="#EF4444"/>
    <rect x="0" y="22" width="216" height="10" fill="#EF4444"/>
    <text x="14" y="21" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF">⚠️ 5-DAY CLERICAL CRISIS</text>

    <!-- Chaos Rows -->
    <g transform="translate(12, 42)">
      <!-- Item 1 -->
      <rect width="192" height="34" rx="6" fill="#FFFFFF" stroke="#FECACA"/>
      <text x="10" y="16" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#991B1B">📄 Unstructured Multi-Page PDFs</text>
      <text x="10" y="27" font-family="-apple-system, sans-serif" font-size="8" fill="#7F1D1D">LIC, Star, HDFC due lists in messy tables</text>

      <!-- Item 2 -->
      <g transform="translate(0, 40)">
        <rect width="192" height="34" rx="6" fill="#FFFFFF" stroke="#FECACA"/>
        <text x="10" y="16" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#991B1B">❌ The "Zero-Contact" Trap</text>
        <text x="10" y="27" font-family="-apple-system, sans-serif" font-size="8" fill="#7F1D1D">Policy dues listed with zero phone numbers</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 80)">
        <rect width="192" height="34" rx="6" fill="#FFFFFF" stroke="#FECACA"/>
        <text x="10" y="16" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#991B1B">⌨️ 25+ Hours Typing into Excel</text>
        <text x="10" y="27" font-family="-apple-system, sans-serif" font-size="8" fill="#7F1D1D">Staff wasting 5–6 days re-entering numbers</text>
      </g>

      <!-- Bottom Red Badge -->
      <g transform="translate(0, 122)">
        <rect width="192" height="38" rx="6" fill="#B91C1C"/>
        <text x="96" y="17" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#FEE2E2" text-anchor="middle">ANNUAL CLERICAL DRAIN</text>
        <text x="96" y="30" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="900" fill="#FFFFFF" text-anchor="middle">₹1,20,000+ Assistant Salary</text>
      </g>
    </g>
  </g>

  <!-- CENTER: 10x Transformation Bolt -->
  <g transform="translate(238, 142)">
    <circle cx="12" cy="18" r="20" fill="#0284C7" stroke="#38BDF8" stroke-width="2.5" filter="url(#cardShadow)"/>
    <text x="12" y="24" font-family="-apple-system, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">⚡</text>
    <text x="12" y="48" font-family="-apple-system, sans-serif" font-size="8" font-weight="900" fill="#0369A1" text-anchor="middle">10x SPEED</text>
  </g>

  <!-- RIGHT: InsuranceSetu Under 30 Mins Card -->
  <g transform="translate(266, 58)">
    <rect width="216" height="216" rx="10" fill="url(#greenGrad)" stroke="#6EE7B7" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="216" height="32" rx="10" fill="#059669"/>
    <rect x="0" y="22" width="216" height="10" fill="#059669"/>
    <text x="14" y="21" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF">🚀 UNDER 30 MINUTES</text>

    <!-- Automated Rows -->
    <g transform="translate(12, 42)">
      <!-- Item 1 -->
      <rect width="192" height="34" rx="6" fill="#FFFFFF" stroke="#A7F3D0"/>
      <text x="10" y="16" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#065F46">📥 1-Click PDF Drop Ingestion</text>
      <text x="10" y="27" font-family="-apple-system, sans-serif" font-size="8" fill="#047857">500 policies ingested in 30 seconds</text>

      <!-- Item 2 -->
      <g transform="translate(0, 40)">
        <rect width="192" height="34" rx="6" fill="#FFFFFF" stroke="#A7F3D0"/>
        <text x="10" y="16" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#065F46">📇 Indian Phonetic Contact Match</text>
        <text x="10" y="27" font-family="-apple-system, sans-serif" font-size="8" fill="#047857">Instant phone linking via Google Contacts</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 80)">
        <rect width="192" height="34" rx="6" fill="#FFFFFF" stroke="#A7F3D0"/>
        <text x="10" y="16" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#065F46">💬 Vernacular WhatsApp Outreach</text>
        <text x="10" y="27" font-family="-apple-system, sans-serif" font-size="8" fill="#047857">1-tap UPI payment reminder links</text>
      </g>

      <!-- Bottom Green Badge -->
      <g transform="translate(0, 122)">
        <rect width="192" height="38" rx="6" fill="#047857"/>
        <text x="96" y="17" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#D1FAE5" text-anchor="middle">OPERATIONAL GAIN</text>
        <text x="96" y="30" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="900" fill="#FFFFFF" text-anchor="middle">Save 25+ Hours Every Month</text>
      </g>
    </g>
  </g>

  <!-- Bottom Comparison Strip -->
  <g transform="translate(18, 286)">
    <rect width="464" height="40" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text x="24" y="24" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#0F2942">📊 The Bottom Line:</text>
    <text x="135" y="24" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#475569">Replace <tspan font-weight="800" fill="#DC2626">5–6 days of clerical typing</tspan> with an <tspan font-weight="800" fill="#16A34A">automated 30-minute monthly routine</tspan>.</text>
  </g>
</svg>