      <stop offset="0%" stop-color="#0F2942"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>
  <rect width="280" height="120" rx="10" fill="#F0F9FF" stroke="#E0F2FE" stroke-width="1.5"/>

  <!-- Left: Mobile Device Mockup -->
  <g transform="translate(24, 10)">
    <rect width="64" height="100" rx="10" fill="url(#phoneAppGrad)"/>
    <rect x="4" y="8" width="56" height="84" rx="6" fill="#FFFFFF"/>
    <!-- Top Bar -->
    <rect x="8" y="14" width="48" height="12" rx="3" fill="#0284C7"/>
    <circle cx="14" cy="20" r="2" fill="#FFFFFF"/>
    <rect x="20" y="18" width="24" height="4" rx="1" fill="#FFFFFF"/>
    <!-- 1-Tap Action Tiles -->
    <rect x="8" y="32" width="22" height="22" rx="4" fill="#DCFCE7"/>
    <text x="19" y="46" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">📦</text>
    <rect x="34" y="32" width="22" height="22" rx="4" fill="#FEF3C7"/>
    <text x="45" y="46" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">💰</text>
    <rect x="8" y="58" width="48" height="16" rx="4" fill="#0F2942"/>
    <text x="32" y="69" font-family="-apple-system, sans-serif" font-size="7" font-weight="700" fill="#38BDF8" text-anchor="middle">1-TAP ORDER</text>
  </g>

  <!-- Right: Feature List & Badges -->
  <g transform="translate(102, 14)">
