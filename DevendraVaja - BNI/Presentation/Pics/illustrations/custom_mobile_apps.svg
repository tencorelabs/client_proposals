    <rect x="0" y="32" width="162" height="26" rx="6" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.2"/>
    <text x="12" y="49" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#0F2942">⚡ Zero Training Required</text>

    <rect x="0" y="64" width="162" height="26" rx="6" fill="#0284C7"/>
    <text x="81" y="80" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">CUSTOM FOR YOUR TEAM</text>
