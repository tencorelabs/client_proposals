    <text x="18" y="122" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#166534">Policy Name: "Virendra"</text>
    <text x="18" y="134" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#0369A1">Phonebook: "Viren Shah"</text>
