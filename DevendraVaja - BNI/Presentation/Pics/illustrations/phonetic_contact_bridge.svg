    <text x="84" y="150" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="800" fill="#15803D" text-anchor="middle">✓ Linked to +91 94260 88771</text>

    <!-- Summary Box -->
    <rect x="10" y="170" width="148" height="46" rx="6" fill="#0F2942"/>
    <text x="84" y="186" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#38BDF8" text-anchor="middle">INDIAN NAME RESOLUTION</text>
    <text x="84" y="202" font-family="-apple-system, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">98%+ Auto-Matched 📇</text>
