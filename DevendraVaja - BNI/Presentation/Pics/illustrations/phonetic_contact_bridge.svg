    <text x="44" y="94" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#0F172A">Smita Patel</text>
    <text x="44" y="106" font-family="-apple-system, sans-serif" font-size="7.5" fill="#64748B">+91 98250 11223</text>

    <rect x="10" y="126" width="136" height="38" rx="5" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="26" cy="145" r="11" fill="#E0F2FE"/>
