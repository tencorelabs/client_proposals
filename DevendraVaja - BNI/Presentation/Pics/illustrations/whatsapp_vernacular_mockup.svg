<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300">
  <defs>
    <linearGradient id="phoneBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="phoneShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="460" height="300" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Left: Language Badges & Stats -->
  <g transform="translate(26, 32)">
    <rect width="180" height="236" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#phoneShadow)"/>
    <rect width="180" height="34" rx="10" fill="#0F2942"/>
    <rect y="24" width="180" height="10" fill="#0F2942"/>
    <text x="14" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">VERNACULAR ENGINE</text>

    <!-- Language Badges -->
    <g transform="translate(14, 46)">
      <rect width="72" height="26" rx="13" fill="#FEF3C7" stroke="#FDE68A"/>
      <text x="36" y="17" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#92400E" text-anchor="middle">ગુજરાતી</text>

      <rect x="80" width="72" height="26" rx="13" fill="#EFF6FF" stroke="#BFDBFE"/>
      <text x="116" y="17" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#1E40AF" text-anchor="middle">हिंदी</text>
    </g>

    <g transform="translate(14, 78)">
      <rect width="72" height="26" rx="13" fill="#F3E8FF" stroke="#E9D5FF"/>
      <text x="36" y="17" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#6B21A8" text-anchor="middle">मराठी</text>

      <rect x="80" width="72" height="26" rx="13" fill="#F1F5F9" stroke="#CBD5E1"/>
      <text x="116" y="17" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#334155" text-anchor="middle">English</text>
    </g>

    <!-- Value Stats -->
    <rect x="14" y="114" width="152" height="42" rx="6" fill="#F0FDF4" stroke="#BBF7D0"/>
    <text x="22" y="130" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#166534">3x Higher Response Rate</text>
    <text x="22" y="144" font-family="-apple-system, sans-serif" font-size="7.5" fill="#15803D">Clients reply instantly to mother tongue</text>

    <rect x="14" y="164" width="152" height="56" rx="6" fill="#0284C7"/>
    <text x="90" y="182" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#BAE6FD" text-anchor="middle">DIRECT 1-TAP DISPATCH</text>
    <text x="90" y="196" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">WhatsApp Web Sync 💬</text>
    <text x="90" y="208" font-family="-apple-system, sans-serif" font-size="7.5" fill="#E0F2FE" text-anchor="middle">Zero manual message typing</text>
  </g>

  <!-- Right: Realistic Smartphone Mockup -->
  <g transform="translate(226, 16)" filter="url(#phoneShadow)">
    <!-- Phone Chassis -->
    <rect width="208" height="268" rx="24" fill="#0F172A" stroke="#334155" stroke-width="2.5"/>
    <!-- Phone Screen -->
    <rect x="6" y="6" width="196" height="256" rx="20" fill="#E5DDD5"/>
    
    <!-- Phone Camera Notch -->
    <rect x="80" y="8" width="48" height="10" rx="5" fill="#0F172A"/>

    <!-- WhatsApp Top Header -->
    <rect x="6" y="22" width="196" height="34" fill="#075E54"/>
    <circle cx="24" cy="39" r="11" fill="#FFFFFF"/>
    <text x="24" y="43" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">🛡️</text>
    <text x="40" y="36" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#FFFFFF">Shreeji Insurance Agency</text>
    <text x="40" y="47" font-family="-apple-system, sans-serif" font-size="6.5" fill="#A7F3D0">LIC &amp; Star Health Verified Advisor ✓</text>

    <!-- WhatsApp Message Bubble (Incoming) -->
    <g transform="translate(14, 64)">
      <rect width="180" height="152" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8"/>
      <!-- Message Header -->
      <text x="10" y="16" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="800" fill="#075E54">📢 પોલિસી પ્રીમિયમ રિન્યુઅલ નોટિસ</text>
      
      <text x="10" y="32" font-family="-apple-system, sans-serif" font-size="7.5" fill="#1E293B">નમસ્તે શ્રી રમેશભાઈ પટેલ,</text>
      <text x="10" y="44" font-family="-apple-system, sans-serif" font-size="7" fill="#475569">તમારી પોલિસીની વિગત નીચે મુજબ છે:</text>
      
      <!-- Details Card inside WhatsApp -->
      <rect x="8" y="52" width="164" height="46" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="14" y="66" font-family="-apple-system, sans-serif" font-size="7" font-weight="700" fill="#334155">વીમો: LIC જીવન લાભ</text>
      <text x="14" y="78" font-family="-apple-system, sans-serif" font-size="7" fill="#64748B">પોલિસી નં: 839201928</text>
      <text x="14" y="90" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="800" fill="#DC2626">રકમ: ₹12,450 • છેલ્લી તારીખ: 15-Nov</text>

      <!-- Direct UPI Payment Button -->
      <g transform="translate(8, 106)">
        <rect width="164" height="28" rx="6" fill="#25D366"/>
        <text x="82" y="18" font-family="-apple-system, sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">💳 Pay ₹12,450 via UPI (Google Pay / PhonePe)</text>
      </g>
      
      <text x="156" y="146" font-family="-apple-system, sans-serif" font-size="6" fill="#94A3B8">09:41 AM ✓✓</text>
    </g>

    <!-- Bottom Input Bar Mockup -->
    <rect x="6" y="226" width="196" height="32" fill="#F0F0F0"/>
    <rect x="14" y="232" width="154" height="20" rx="10" fill="#FFFFFF"/>
    <text x="24" y="245" font-family="-apple-system, sans-serif" font-size="7" fill="#94A3B8">Type a message...</text>
    <circle cx="186" cy="242" r="10" fill="#075E54"/>
    <text x="186" y="246" font-family="-apple-system, sans-serif" font-size="8" fill="#FFFFFF" text-anchor="middle">🎤</text>
  </g>
</svg>
