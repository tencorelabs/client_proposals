<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mastermind for AI in BBA - Interactive Presentation Platform</title>
  <meta name="description" content="An interactive, editable light-themed slideshow platform and PDF exporter for the 'Mastermind for AI in BBA' curriculum.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- App Header / Customization & Control Toolbar -->
  <header id="toolbar">
    <div class="brand-section">
      <div class="logo-icon">X</div>
      <div class="brand-title">
        <h1>Mastermind for AI in BBA</h1>
        <span>TenCore Labs • Presentation Studio</span>
      </div>
    </div>
    
    <div class="toolbar-controls">
      <!-- Present vs Edit Mode toggles -->
      <div class="view-toggle">
        <button id="btn-present-mode" class="toggle-btn active" aria-label="Switch to Presenter Mode">
          👁️ Present
        </button>
        <button id="btn-edit-mode" class="toggle-btn" aria-label="Switch to Slide Editor Mode">
          ✏️ Edit Slides
        </button>
      </div>

      <!-- Action Panel Buttons -->
      <button id="btn-reset" class="btn" title="Reset presentation to original templates">
        🔄 Reset
      </button>
      <button id="btn-save" class="btn" title="Save changes locally in browser">
        💾 Save
      </button>
      <button id="btn-export-pdf" class="btn btn-primary" title="Export slides to landscape PDF">
        📄 Export to PDF
      </button>
    </div>
  </header>

  <!-- Main Workspaces -->
  <main>
    
    <!-- 1. PRESENTATION WORKSPACE -->
    <section id="presentation-view" aria-label="Slideshow Viewer">
      <!-- 16:9 Landscape Aspect Slide Deck Container -->
      <div class="slide-deck-viewport">
        <div id="slide-viewport">
          <!-- Slide elements injected here dynamically by app.js -->
        </div>
      </div>
      
      <!-- Slide navigation bar -->
      <div class="slide-navigation-controls">
        <div class="nav-arrows">
          <button id="nav-first" class="nav-arrow-btn" title="Go to First Slide" aria-label="First slide">⏮️</button>
          <button id="nav-prev" class="nav-arrow-btn" title="Go to Previous Slide" aria-label="Previous slide">◀</button>
        </div>
        
        <div style="display: flex; align-items: center; gap: 4px;">
          <span id="slide-counter-text" class="slide-number-indicator">1 / 13</span>
          <div class="progress-bar-container" id="slide-progress">
            <div id="slide-progress-fill" class="progress-bar-fill"></div>
          </div>
        </div>
        
        <div class="nav-arrows">
          <button id="nav-next" class="nav-arrow-btn" title="Go to Next Slide" aria-label="Next slide">▶</button>
          <button id="nav-last" class="nav-arrow-btn" title="Go to Last Slide" aria-label="Last slide">⏭️</button>
          <button id="btn-fullscreen" class="nav-arrow-btn" title="Toggle Fullscreen Present Mode" aria-label="Fullscreen" style="margin-left: 8px;">📺</button>
        </div>
      </div>
    </section>

    <!-- 2. EDITING WORKSPACE -->
    <section id="editor-view" aria-label="Slides Scroll Editor" style="display: none;">
      <!-- Slide editor wrappers injected here dynamically by app.js -->
    </section>

    <!-- Editor controls overlay (visible only in Edit Mode) -->
    <div class="editor-footer-controls" style="display: none;">
      <button id="btn-add-slide" class="btn btn-success" style="padding: 10px 24px; border-radius: 20px; font-weight: 700; box-shadow: 0 4px 12px rgba(16,185,129,0.3);">
        ➕ Add New Slide
      </button>

      <!-- Layout Selection Popup -->
      <div id="layout-picker" class="layout-picker" aria-hidden="true">
        <div class="layout-option" data-layout="title" title="Title and subtitle cover slide">
          <div class="layout-icon" style="flex-direction: column; justify-content: center; align-items: center;">
            <div style="width: 70%; height: 3px; background: var(--text-muted); margin-bottom: 2px;"></div>
            <div style="width: 40%; height: 2px; background: var(--text-muted);"></div>
          </div>
          <span>Title Slide</span>
        </div>
        <div class="layout-option" data-layout="divider" title="Section divider with horizontal highlight">
          <div class="layout-icon" style="flex-direction: column; justify-content: center; align-items: center;">
            <div style="width: 20%; height: 2px; background: var(--primary); margin-bottom: 4px;"></div>
            <div style="width: 60%; height: 3px; background: var(--text-muted);"></div>
          </div>
          <span>Divider Slide</span>
        </div>
        <div class="layout-option" data-layout="bullets" title="Standard vertical bullet checklist">
          <div class="layout-icon" style="flex-direction: column; justify-content: flex-start; padding: 4px; gap: 4px;">
            <div style="display: flex; gap: 2px; align-items: center;"><div style="width: 2px; height: 2px; background: var(--primary);"></div><div style="width: 20px; height: 1px; background: var(--text-muted);"></div></div>
            <div style="display: flex; gap: 2px; align-items: center;"><div style="width: 2px; height: 2px; background: var(--primary);"></div><div style="width: 20px; height: 1px; background: var(--text-muted);"></div></div>
            <div style="display: flex; gap: 2px; align-items: center;"><div style="width: 2px; height: 2px; background: var(--primary);"></div><div style="width: 20px; height: 1px; background: var(--text-muted);"></div></div>
          </div>
          <span>Bullets List</span>
        </div>
        <div class="layout-option" data-layout="twocol" title="Compare two blocks side-by-side">
          <div class="layout-icon" style="gap: 4px; padding: 4px;">
            <div style="flex: 1; border: 1px dashed var(--text-muted); border-radius: 2px;"></div>
            <div style="flex: 1; border: 1px dashed var(--text-muted); border-radius: 2px;"></div>
          </div>
          <span>2 Columns</span>
        </div>
        <div class="layout-option" data-layout="threecard" title="Display grid of three summary cards">
          <div class="layout-icon" style="gap: 2px; padding: 4px;">
            <div style="flex: 1; border: 1px dashed var(--text-muted); border-radius: 1px;"></div>
            <div style="flex: 1; border: 1px dashed var(--text-muted); border-radius: 1px;"></div>
            <div style="flex: 1; border: 1px dashed var(--text-muted); border-radius: 1px;"></div>
          </div>
          <span>3 Cards Grid</span>
        </div>
      </div>
    </div>

  </main>

  <!-- Presentation Logic script -->
  <script src="app.js"></script>
</body>
</html>
